steps:
  - name: gcr.io/cloud-builders/docker
    id: build
    args:
      - build
      - --pull
      - --build-arg
      - TORCH_INDEX_URL=${_TORCH_INDEX_URL}
      - --tag
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}
      - .

  - name: gcr.io/cloud-builders/docker
    id: push
    args:
      - push
      - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPOSITORY}/${_IMAGE_NAME}:${_TAG}

substitutions:
  _REGION: asia-southeast1
  _REPOSITORY: gomoku
  _IMAGE_NAME: gomoku-zero
  _TAG: latest
  _TORCH_INDEX_URL: https://download.pytorch.org/whl/cpu

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 3600s

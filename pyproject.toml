[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gomoku-zero"
version = "0.1.0"
description = "A reproducible AlphaZero-style Gomoku engine with legal-action masking, PUCT, training, evaluation, and a public analysis API."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Alchemist-X" }]
dependencies = [
  "fastapi>=0.116,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.10,<3",
  "torch>=2.6,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
cloud = [
  "google-cloud-storage>=2.19,<4",
]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
gomoku-api = "gomoku_zero.api:main"
gomoku-convergence = "gomoku_zero.convergence:main"
gomoku-train = "gomoku_zero.training:main"
gomoku-evaluate = "gomoku_zero.evaluation:main"
gomoku-tournament = "gomoku_zero.tournament:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gomoku_zero"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
